[package]
name = "snek-web"
version = "0.1.0"
edition = "2021"

[dependencies]
snek-shared = { path = "../shared" }
serde = { workspace = true }
postcard = { workspace = true }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Location", "History", "Storage", "Crypto",
    "KeyboardEvent", "TouchEvent", "Touch", "TouchList",
    "MouseEvent", "Element", "DomRect",
    "Navigator", "ShareData", "Clipboard",
    "HtmlInputElement", "HtmlSelectElement",
    "WebTransport", "WebTransportBidirectionalStream",
    "Worker", "WorkerOptions", "WorkerType", "Blob", "BlobPropertyBag", "Url",
    "WebTransportDatagramDuplexStream", "WebTransportReceiveStream",
    "WebTransportSendStream", "WebTransportCloseInfo",
    "ReadableStream", "WritableStream", "WritableStreamDefaultWriter",
    "console",
] }
wasm-bindgen-futures = "0.4"
# Keep in lockstep with gloo-net's wasm-streams (duplicate versions define
# duplicate wasm-bindgen shims and break LTO).
wasm-streams = "0.5"
futures-util = { version = "0.3", default-features = false }
futures-channel = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
console_error_panic_hook = "0.1"
