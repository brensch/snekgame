name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The server embeds web/dist; tests don't need the frontend in it.
      - run: mkdir -p web/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude snek-web --all-targets -- -D warnings
      - run: cargo test --workspace --exclude snek-web

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - run: cargo clippy -p snek-web --target wasm32-unknown-unknown -- -D warnings
      - run: trunk build --release
        working-directory: web

  # Line coverage of the engine, bot and server (the wasm UI has no native
  # tests). On main, the badge is written to the `badges` branch, which the
  # README shows: the repo is private, so no outside badge service can see it.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: mkdir -p web/dist
      - run: cargo llvm-cov --workspace --exclude snek-web --json --summary-only --output-path cov.json
      - name: Summarise
        id: cov
        run: |
          pct=$(jq '.data[0].totals.lines.percent' cov.json)
          printf 'Line coverage: **%.1f%%**\n' "$pct" >> "$GITHUB_STEP_SUMMARY"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
      - name: Publish badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir badge && .github/scripts/badge.sh coverage "${{ steps.cov.outputs.pct }}" > badge/coverage.svg
          cd badge
          git init -q -b badges
          git add coverage.svg
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "coverage badge for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
