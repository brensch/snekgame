[package]
name = "snek-server"
version = "0.1.0"
edition = "2021"

[dependencies]
snek-shared = { path = "../shared" }
serde = { workspace = true }
postcard = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
wtransport = { version = "0.7", features = ["self-signed"] }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8"
brotli = "8"
mime_guess = "2"
sha2 = "0.10"

[dev-dependencies]
# dangerous-configuration only exists so tests can skip cert validation
# against the self-signed test identity.
wtransport = { version = "0.7", features = ["self-signed", "dangerous-configuration"] }
